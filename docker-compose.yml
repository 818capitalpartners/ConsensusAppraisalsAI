version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: 818-capital-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev818
      POSTGRES_PASSWORD: dev818pass
      POSTGRES_DB: capital818
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
