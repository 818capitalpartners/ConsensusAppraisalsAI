[project]
name = "818-capital-backend"
version = "0.1.0"
description = "818 Capital API - FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
dev = "uvicorn app.main:app --reload --port 3001"
seed = "python -m app.seed"
