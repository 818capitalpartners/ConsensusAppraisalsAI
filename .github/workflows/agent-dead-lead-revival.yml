name: Agent - Dead Lead Revival

# Tuesdays at 10:23 ET (14:23 UTC). Scans dead/lost leads whose
# fallout reason is now solvable and drafts revive outreach.

on:
  schedule:
    - cron: '23 14 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic==0.42.0 requests==2.32.3
      - name: Run Dead Lead Revival
        working-directory: scripts/agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python dead_lead_revival.py
