name: Agent - Daily Dashboard

# Every weekday at 7:03 AM ET (11:03 UTC). Computes Red/Yellow/Green
# health across active pipeline, drafts 3 actions per Red deal, 1 per
# Yellow, writes the dashboard markdown to docs/daily-dashboard/.
# Per spec §6.

on:
  schedule:
    - cron: '3 11 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic==0.42.0 requests==2.32.3
      - name: Compute daily dashboard
        working-directory: scripts/agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python daily_dashboard.py
      - name: Commit dashboard
        run: |
          git config user.name "818 Capital Dashboard Bot"
          git config user.email "bot@818capitalpartners.com"
          git add docs/daily-dashboard/
          if git diff --cached --quiet; then
            echo "No dashboard change."
          else
            git commit -m "Daily dashboard: $(date +'%Y-%m-%d')"
            git push
          fi
